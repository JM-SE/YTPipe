services:
  - type: web
    name: ytpipe-staging
    runtime: python
    plan: free
    buildCommand: pip install -e .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_NAME
        value: ytpipe
      - key: APP_ENV
        value: staging
      - key: EMAIL_DELIVERY_MODE
        value: fake
      - key: POLL_QUOTA_DAILY_BUDGET
        value: 500
      - key: POLL_QUOTA_SAFETY_STOP_ENABLED
        value: true
      - key: PUSH_NOTIFICATIONS_ENABLED
        value: false
      - key: EXPO_PUSH_ENDPOINT
        value: https://exp.host/--/api/v2/push/send
      - key: EXPO_PUSH_RECEIPTS_ENABLED
        value: false
      - key: EXPO_PUSH_RECEIPTS_ENDPOINT
        value: https://exp.host/--/api/v2/push/getReceipts
      - key: APP_SECRET_KEY
        sync: false
      - key: INTERNAL_API_BEARER_TOKEN
        sync: false
      - key: MOBILE_API_BEARER_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: EXPO_ACCESS_TOKEN
        sync: false
